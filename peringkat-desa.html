<!-- =====================================================
     APP JS
     ===================================================== -->

<script src="js/app.js"></script>



<script>

/* =========================================================
   RESIK HUB
   PERINGKAT DESA
   ========================================================= */


/* ---------------------------------------------------------
   DATA PERINGKAT DESA
   ---------------------------------------------------------

   Data dibuat langsung di halaman agar ranking
   menggunakan data yang sudah ditentukan.

   Urutan akan tetap dihitung otomatis berdasarkan score.
   --------------------------------------------------------- */

const rankingUsers = [

  {
    id: "hartatik",
    name: "Hartatik",
    score: 313,
    greenScore: 313,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  },

  {
    id: "saroh",
    name: "Saroh",
    score: 308,
    greenScore: 308,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  },

  {
    id: "tini",
    name: "Tini",
    score: 254,
    greenScore: 254,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  },

  {
    id: "pini",
    name: "Pini",
    score: 195,
    greenScore: 195,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  },

  {
    id: "iin",
    name: "Iin",
    score: 187,
    greenScore: 187,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  },

  {
    id: "ana",
    name: "Ana",
    score: 182,
    greenScore: 182,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  },

  {
    id: "wiwik",
    name: "Wiwik",
    score: 95,
    greenScore: 95,
    village: "Dusun Mojoroto",
    gender: "female",
    avatar: ""
  }

];



/* ---------------------------------------------------------
   CURRENT USER
   --------------------------------------------------------- */

function getCurrentUser() {

  try {

    if (
      typeof getCurrentUserFromStorage === "function"
    ) {

      const user =
        getCurrentUserFromStorage();

      if (user) {

        return user;

      }

    }

  } catch (error) {

    console.warn(
      "Tidak dapat mengambil current user."
    );

  }


  /*
    Cek beberapa kemungkinan key
    dari localStorage.
  */

  const keys = [

    "resik_current_user",

    "currentUser",

    "current_user",

    "loggedUser",

    "user"

  ];


  for (const key of keys) {

    const value =
      localStorage.getItem(key);


    if (!value) {

      continue;

    }


    try {

      return JSON.parse(value);

    } catch (error) {

      console.warn(
        "Data current user tidak valid:",
        key
      );

    }

  }


  return null;

}



/* ---------------------------------------------------------
   NORMALISASI USER
   --------------------------------------------------------- */

function normalizeUser(user) {

  if (!user) {

    return null;

  }


  const name =

    user.name ||

    user.nama ||

    user.fullName ||

    user.full_name ||

    user.username ||

    "Pengguna";


  const score =

    Number(

      user.score ??

      user.greenScore ??

      user.green_score ??

      user.greenPoints ??

      user.green_points ??

      user.points ??

      user.point ??

      0

    );


  const village =

    user.village ||

    user.villageName ||

    user.desa ||

    "Dusun Mojoroto";


  const avatar =

    user.avatar ||

    user.photo ||

    user.photoURL ||

    user.profilePhoto ||

    user.image ||

    "";


  const id =

    user.id ||

    user.userId ||

    user.user_id ||

    user.email ||

    user.username ||

    name;


  return {

    ...user,

    id: id,

    name: name,

    score: Number.isFinite(score)

      ? score

      : 0,

    village: village,

    avatar: avatar

  };

}



/* ---------------------------------------------------------
   AMBIL DATA RANKING
   --------------------------------------------------------- */

function getRankingData() {


  /*
    Gunakan data ranking yang sudah ditentukan.
  */

  const users = rankingUsers

    .map(normalizeUser)

    .filter(Boolean);


  /*
    Urutkan dari score terbesar
    ke score terkecil.
  */

  users.sort(

    (a, b) =>

      b.score - a.score

  );


  /*
    Tambahkan nomor ranking.
  */

  return users.map(

    (user, index) => ({

      ...user,

      rank: index + 1

    })

  );

}



/* ---------------------------------------------------------
   AVATAR HTML
   --------------------------------------------------------- */

function avatarHTML(
  user,
  size = "normal"
) {


  /*
    Jika user mempunyai foto,
    gunakan foto tersebut.
  */

  if (user.avatar) {

    return `

      <img

        class="rank-avatar ${size}"

        src="${escapeHTML(user.avatar)}"

        alt="${escapeHTML(user.name)}"

        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "

      >


      <div

        class="rank-avatar-fallback ${size}"

        style="display:none"

      >

        ${getAvatarEmoji(user)}

      </div>

    `;

  }


  /*
    Jika tidak ada foto,
    gunakan avatar emoji.
  */

  return `

    <div
      class="rank-avatar-fallback ${size}">

      ${getAvatarEmoji(user)}

    </div>

  `;

}



/* ---------------------------------------------------------
   AVATAR EMOJI
   --------------------------------------------------------- */

function getAvatarEmoji(user) {


  const gender =

    String(

      user.gender ||

      user.jenisKelamin ||

      ""

    ).toLowerCase();


  if (

    gender === "female" ||

    gender === "perempuan" ||

    gender === "wanita"

  ) {

    return "👩";

  }


  if (

    gender === "male" ||

    gender === "laki-laki" ||

    gender === "pria"

  ) {

    return "👨";

  }


  return "👤";

}



/* ---------------------------------------------------------
   ESCAPE HTML
   --------------------------------------------------------- */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* ---------------------------------------------------------
   FORMAT ANGKA
   --------------------------------------------------------- */

function formatScore(score) {

  return Number(score || 0)

    .toLocaleString("id-ID");

}



/* ---------------------------------------------------------
   RENDER PODIUM
   --------------------------------------------------------- */

function renderPodium(ranking) {


  const podium =

    document.getElementById(
      "podium"
    );


  if (!podium) {

    return;

  }


  const first =

    ranking[0] || null;


  const second =

    ranking[1] || null;


  const third =

    ranking[2] || null;



  if (!first) {

    podium.innerHTML = `

      <div class="ranking-empty">

        Belum ada data peringkat.

      </div>

    `;

    return;

  }



  /*
    Susunan podium:

    Kiri   = Peringkat 2
    Tengah = Peringkat 1
    Kanan  = Peringkat 3
  */


  podium.innerHTML = `


    <!-- =================================================
         PERINGKAT 2
         ================================================= -->

    <div class="podium-person second">


      <div class="podium-avatar-wrap">


        ${
          second

            ? avatarHTML(
                second,
                "medium"
              )

            : `
              <div
                class="rank-avatar-fallback medium">

                👤

              </div>
            `
        }


        <span class="podium-number">

          2

        </span>


      </div>


      <strong>

        ${
          second

            ? escapeHTML(
                second.name
              )

            : "-"
        }

      </strong>


      <span class="podium-score">

        ●

        ${
          second

            ? formatScore(
                second.score
              )

            : "0"
        }

      </span>


    </div>



    <!-- =================================================
         PERINGKAT 1
         ================================================= -->

    <div class="podium-person first">


      <div class="podium-avatar-wrap">


        ${

          avatarHTML(
            first,
            "large"
          )

        }


        <span
          class="podium-number winner-number">

          1

        </span>


      </div>


      <strong>

        ${

          escapeHTML(
            first.name
          )

        }

      </strong>


      <span class="podium-score">

        ●

        ${

          formatScore(
            first.score
          )

        }

      </span>


      <div class="winner-label">

        WINNER

      </div>


    </div>



    <!-- =================================================
         PERINGKAT 3
         ================================================= -->

    <div class="podium-person third">


      <div class="podium-avatar-wrap">


        ${
          third

            ? avatarHTML(
                third,
                "medium"
              )

            : `
              <div
                class="rank-avatar-fallback medium">

                👤

              </div>
            `
        }


        <span class="podium-number">

          3

        </span>


      </div>


      <strong>

        ${
          third

            ? escapeHTML(
                third.name
              )

            : "-"
        }

      </strong>


      <span class="podium-score">

        ●

        ${
          third

            ? formatScore(
                third.score
              )

            : "0"
        }

      </span>


    </div>

  `;

}



/* ---------------------------------------------------------
   RENDER DAFTAR RANKING
   --------------------------------------------------------- */

function renderRankingList(ranking) {


  const container =

    document.getElementById(
      "rankingList"
    );


  if (!container) {

    return;

  }


  /*
    Ambil ranking 4 sampai 7.
  */

  const displayList =

    ranking.slice(3, 7);



  if (
    displayList.length === 0
  ) {

    container.innerHTML = `

      <div class="ranking-empty">

        Belum ada pengguna lain.

      </div>

    `;

    return;

  }



  container.innerHTML =

    displayList

      .map(user => {


        /*
          Karena data ranking dibuat
          sebagai data desa tetap,
          tidak ada label "Anda"
          yang dipaksakan.
        */


        return `

          <div

            class="rank-row"

            data-user-id="${escapeHTML(
              user.id
            )}"

          >


            <!-- NOMOR RANKING -->

            <div class="rank-position">

              ${user.rank}

            </div>



            <!-- USER -->

            <div class="rank-user">


              ${

                avatarHTML(
                  user,
                  "small"
                )

              }


              <div class="rank-user-info">


                <strong>

                  ${

                    escapeHTML(
                      user.name
                    )

                  }

                </strong>


              </div>


            </div>



            <!-- SCORE -->

            <div class="rank-score">

              ${

                formatScore(
                  user.score
                )

              }


              <span>

                ●

              </span>

            </div>


          </div>

        `;

      })

      .join("");

}



/* ---------------------------------------------------------
   RENDER SEMUA RANKING
   --------------------------------------------------------- */

function renderRanking() {


  const ranking =

    getRankingData();


  renderPodium(
    ranking
  );


  renderRankingList(
    ranking
  );

}



/* ---------------------------------------------------------
   TAB BULAN INI / SEPANJANG WAKTU
   --------------------------------------------------------- */

document

  .querySelectorAll(
    ".rank-tab"
  )

  .forEach(button => {


    button.addEventListener(
      "click",
      function () {


        /*
          Hapus active dari semua tab.
        */

        document

          .querySelectorAll(
            ".rank-tab"
          )

          .forEach(item => {

            item.classList.remove(
              "active"
            );

          });



        /*
          Aktifkan tab yang dipilih.
        */

        this.classList.add(
          "active"
        );



        /*
          Saat ini kedua tab menggunakan
          data ranking yang sama.

          Kalau nanti ingin membuat
          data bulanan dan sepanjang waktu
          berbeda, bagian ini bisa
          dikembangkan.
        */

        renderRanking();

      }
    );

  });



/* ---------------------------------------------------------
   TOMBOL LIHAT SEMUA
   --------------------------------------------------------- */

const seeAllBtn =

  document.getElementById(
    "seeAllBtn"
  );


if (seeAllBtn) {


  seeAllBtn.addEventListener(
    "click",
    function () {


      const ranking =

        getRankingData();


      const container =

        document.getElementById(
          "rankingList"
        );


      if (!container) {

        return;

      }


      /*
        Tampilkan seluruh ranking
        ketika tombol Lihat Semua
        ditekan.
      */

      container.innerHTML =

        ranking

          .map(user => `

            <div

              class="rank-row"

              data-user-id="${escapeHTML(
                user.id
              )}"

            >


              <div class="rank-position">

                ${user.rank}

              </div>


              <div class="rank-user">


                ${

                  avatarHTML(
                    user,
                    "small"
                  )

                }


                <div class="rank-user-info">

                  <strong>

                    ${

                      escapeHTML(
                        user.name
                      )

                    }

                  </strong>

                </div>


              </div>


              <div class="rank-score">

                ${

                  formatScore(
                    user.score
                  )

                }

                <span>

                  ●

                </span>

              </div>


            </div>

          `)

          .join("");


      /*
        Ubah teks tombol supaya
        pengguna tahu daftar sudah
        ditampilkan seluruhnya.
      */

      this.textContent =
        "Tampilkan Lebih Sedikit";


      /*
        Jika diklik lagi,
        kembali ke ranking 4-7.
      */

      this.onclick = function () {


        renderRanking();


        this.textContent =
          "Lihat Semua";


        /*
          Pasang kembali handler.
        */

        this.onclick =
          showAllRanking;

      };

    }

  );

}



/* ---------------------------------------------------------
   FUNGSI LIHAT SEMUA
   --------------------------------------------------------- */

function showAllRanking() {


  const ranking =

    getRankingData();


  const container =

    document.getElementById(
      "rankingList"
    );


  if (!container) {

    return;

  }


  container.innerHTML =

    ranking

      .map(user => `

        <div

          class="rank-row"

          data-user-id="${escapeHTML(
            user.id
          )}"

        >


          <div class="rank-position">

            ${user.rank}

          </div>


          <div class="rank-user">


            ${

              avatarHTML(
                user,
                "small"
              )

            }


            <div class="rank-user-info">

              <strong>

                ${

                  escapeHTML(
                    user.name
                  )

                }

              </strong>

            </div>


          </div>


          <div class="rank-score">

            ${

              formatScore(
                user.score
              )

            }


            <span>

              ●

            </span>

          </div>


        </div>

      `)

      .join("");


  const button =

    document.getElementById(
      "seeAllBtn"
    );


  if (button) {

    button.textContent =
      "Tampilkan Lebih Sedikit";


    button.onclick =
      function () {

        renderRanking();

        this.textContent =
          "Lihat Semua";

        this.onclick =
          showAllRanking;

      };

  }

}



/* ---------------------------------------------------------
   REAL-TIME UPDATE
   --------------------------------------------------------- */


/*
  Karena data ranking berada
  langsung di dalam JavaScript,
  halaman tidak perlu mengambil
  data ranking dari localStorage.
*/


/*
  Tetap render ulang ketika
  halaman kembali aktif.
*/

document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.visibilityState ===
      "visible"
    ) {

      renderRanking();

    }

  }
);



/* ---------------------------------------------------------
   INITIAL LOAD
   --------------------------------------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    renderRanking();

  }
);

</script>


</body>
