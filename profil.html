<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Profil — RESIK Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css">


    <style>

        /* =====================================================
           PROFILE USER
        ====================================================== */

        .profile-top {
            text-align: center;
            padding: 10px 0 24px;
        }


        .profile-avatar {
            width: 82px;
            height: 82px;

            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #0f8f5b,
                    #087a4d
                );

            color: #ffffff;

            font-size: 28px;
            font-weight: 800;

            box-shadow:
                0 10px 25px
                rgba(15, 143, 91, 0.20);
        }


        .profile-name {
            margin: 0;

            font-size: 28px;
            font-weight: 800;
        }


        .profile-email {
            margin: 6px 0 10px;

            color: #6b7280;

            font-size: 14px;
        }


        .profile-role {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 5px 12px;

            border-radius: 999px;

            background: #e8f7ef;

            color: #087a4d;

            font-size: 12px;
            font-weight: 700;

            margin-bottom: 10px;
        }


        .profile-top .location {
            margin-top: 4px;
        }


        /* =====================================================
           CARD YANG BISA DIKLIK
        ====================================================== */

        .clickable-card {
            cursor: pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }


        .clickable-card:hover {
            transform: translateY(-2px);
        }


        .clickable-card:active {
            transform: scale(0.99);
        }


        .clickable-card:focus {
            outline: 3px solid
                rgba(15, 143, 91, 0.25);

            outline-offset: 3px;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .profile-loading {
            opacity: 0.65;
        }


        /* =====================================================
           SCORE
        ====================================================== */

        #greenScore {
            font-size: 36px;
        }


        .green-text {
            color: #087a4d;
            font-weight: 700;
        }

    </style>

</head>

        <!-- EMAIL -->

        <p

        <!-- ROLE -->

            class="profile-role"
            id="profileRole">

        <!-- LOCATION -->

        <div class="badges">

                id="recyclerBadge">

            </span>

    <!-- =================================================
         ID DIGITAL

    <!-- =================================================

<!-- =====================================================
     PROFILE SCRIPT
====================================================== -->

<script type="module">

/* =====================================================
   ELEMENT
===================================================== */

const profileName =
    document.getElementById("profileName");

const profileEmail =
    document.getElementById("profileEmail");

const profileRole =
    document.getElementById("profileRole");

const profileInitials =
    document.getElementById("profileInitials");

const userId =
    document.getElementById("userId");

const greenScore =
    document.getElementById("greenScore");

const greenScoreChange =
    document.getElementById("greenScoreChange");

const achievementCount =
    document.getElementById("achievementCount");

const achievementText =
    document.getElementById("achievementText");

const accountStatus =
    document.getElementById("accountStatus");

const verificationStatus =
    document.getElementById("verificationStatus");

const qrUserText =
    document.getElementById("qrUserText");


/* =====================================================
   FORMAT NAMA
===================================================== */

function getInitials(name) {

    const value =
        String(name || "").trim();

    if (!value) {
        return "W";
    }

    return value
        .split(/\s+/)
        .slice(0, 2)
        .map(
            word =>
                word
                    .charAt(0)
                    .toUpperCase()
        )
        .join("");
}


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatNumber(value) {

    return Number(value || 0)
        .toLocaleString("id-ID");

}


/* =====================================================
   ACHIEVEMENT
===================================================== */

function updateAchievement(score) {

    let count = 0;
    let text = "☆ Belum ada pencapaian";


    if (score >= 1000) {

        count = 5;
        text = "♛ Eco Champion";

    } else if (score >= 500) {

        count = 4;
        text = "✦ Pahlawan Lingkungan";

    } else if (score >= 250) {

        count = 3;
        text = "♧ Pejuang Hijau";

    } else if (score >= 100) {

        count = 2;
        text = "♻ Pendaur Ulang Aktif";

    } else if (score >= 25) {

        count = 1;
        text = "♧ Pendaur Ulang";

    }


    if (achievementCount) {

        achievementCount.textContent =
            count;

    }


    if (achievementText) {

        achievementText.textContent =
            text;

    }

}


/* =====================================================
   TAMPILKAN PROFILE
===================================================== */

function renderProfile(profile, user) {

    if (!profile && !user) {
        return;
    }


    /* -------------------------------------------------
       NAMA
    ------------------------------------------------- */

    const name =
        profile?.name ||
        user?.displayName ||
        "Warga";


    if (profileName) {

        profileName.textContent =
            name;

    }


    /* -------------------------------------------------
       EMAIL
    ------------------------------------------------- */

    const email =
        profile?.email ||
        user?.email ||
        "email@example.com";


    if (profileEmail) {

        profileEmail.textContent =
            email;

    }


    /* -------------------------------------------------
       ROLE
    ------------------------------------------------- */

    const role =
        profile?.role ||
        "warga";


    if (profileRole) {

        profileRole.textContent =
            role === "admin"
                ? "Admin"
                : "Warga";

    }


    /* -------------------------------------------------
       INITIAL
    ------------------------------------------------- */

    if (profileInitials) {

        profileInitials.textContent =
            getInitials(name);

    }


    /* -------------------------------------------------
       USER ID
    ------------------------------------------------- */

    const uid =
        user?.uid ||
        profile?.uid ||
        "-";


    if (userId) {

        userId.textContent =
            uid;

    }


    /* -------------------------------------------------
       QR
    ------------------------------------------------- */

    if (qrUserText) {

        qrUserText.textContent =
            uid;

    }


    /* -------------------------------------------------
       GREEN SCORE
       
       Prioritas:
       1. greenScore Firestore
       2. points Firestore
       3. 0
    ------------------------------------------------- */

    const points =
        Number(profile?.points) || 0;

    const firestoreGreenScore =
        Number(profile?.greenScore) || 0;


    const score =
        firestoreGreenScore > 0
            ? firestoreGreenScore
            : points;


    if (greenScore) {

        greenScore.textContent =
            formatNumber(score);

    }


    /* -------------------------------------------------
       SCORE CHANGE
    ------------------------------------------------- */

    if (greenScoreChange) {

        if (score > 0) {

            greenScoreChange.textContent =
                "↗ Aktif bulan ini";

        } else {

            greenScoreChange.textContent =
                "↗ 0% bulan ini";

        }

    }


    /* -------------------------------------------------
       ACHIEVEMENT
    ------------------------------------------------- */

    updateAchievement(score);


    /* -------------------------------------------------
       ACCOUNT
    ------------------------------------------------- */

    if (accountStatus) {

        accountStatus.textContent =
            "Aktif";

    }


    if (verificationStatus) {

        verificationStatus.textContent =
            user?.emailVerified
                ? "Terverifikasi"
                : "Belum diverifikasi";

    }

}


/* =====================================================
   TUNGGU FIREBASE APP
===================================================== */

async function waitForFirebase() {

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        if (
            window.resikAuth &&
            window.resikGetProfile
        ) {

            return true;

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );

    }

    return false;

}


/* =====================================================
   LOAD FIREBASE PROFILE
===================================================== */

async function loadProfile() {

    const ready =
        await waitForFirebase();


    if (!ready) {

        console.error(
            "Firebase RESIK Hub belum siap."
        );

        return;

    }


    const auth =
        window.resikAuth;


    /* -------------------------------------------------
       CEK USER LOGIN
    ------------------------------------------------- */

    const user =
        auth.currentUser;


    if (user) {

        const profile =
            await window.resikGetProfile(
                user.uid
            );

        renderProfile(
            profile,
            user
        );

    }


    /* -------------------------------------------------
       AUTH STATE
       
       Berguna ketika Firebase belum selesai
       memulihkan session login.
    ------------------------------------------------- */

    auth.onAuthStateChanged(
        async currentUser => {

            if (!currentUser) {

                console.log(
                    "Tidak ada user login."
                );

                return;

            }


            try {

                const profile =
                    await window.resikGetProfile(
                        currentUser.uid
                    );


                renderProfile(
                    profile,
                    currentUser
                );


            } catch (error) {

                console.error(
                    "PROFILE LOAD ERROR:",
                    error
                );

            }

        }
    );

}


/* =====================================================
   QR MODAL
===================================================== */

const qrButton =
    document.getElementById("qr");

const qrModal =
    document.getElementById("qrModal");

const closeQr =
    document.getElementById("closeQr");


if (qrButton && qrModal) {

    qrButton.addEventListener(
        "click",
        () => {

            qrModal.classList.add(
                "show"
            );

        }
    );

}


if (closeQr && qrModal) {

    closeQr.addEventListener(
        "click",
        () => {

            qrModal.classList.remove(
                "show"
            );

        }
    );

}


if (qrModal) {

    qrModal.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                qrModal
            ) {

                qrModal.classList.remove(
                    "show"
                );

            }

        }
    );

}


/* =====================================================
   NAVIGASI CARD
===================================================== */

document
    .querySelectorAll("[data-nav]")
    .forEach(element => {

        element.addEventListener(
            "click",
            () => {

                const target =
                    element.dataset.nav;

                if (target) {

                    window.location.href =
                        target;

                }

            }
        );


        element.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    const target =
                        element.dataset.nav;

                    if (target) {

                        window.location.href =
                            target;

                    }

                }

            }
        );

    });


/* =====================================================
   START
===================================================== */

loadProfile();

</script>


</body>
