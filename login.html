<!doctype html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <meta
        name="theme-color"
        content="#087a38">

    <meta
        name="description"
        content="Masuk ke RESIK Hub — Platform digital pengelolaan sampah dan ekonomi sirkular untuk Gresik.">

    <title>Masuk — RESIK Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        /* =====================================================
           LOGIN LOGO
        ====================================================== */

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-bottom: 28px;

            color: #087a38;

            text-decoration: none;
        }

        .auth-logo-image {
            width: 44px;
            height: 44px;

            display: block;

            object-fit: contain;

            border-radius: 6px;

            flex-shrink: 0;
        }

        .auth-logo-text {
            color: #087a38;

            font-size: 20px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: -0.035em;

            white-space: nowrap;
        }


        /* =====================================================
           LOGIN PAGE
        ====================================================== */

        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(25, 168, 107, 0.08),
                    transparent 30%
                ),
                #f6f8f5;
        }


        .auth-card {
            width: min(
                100%,
                470px
            );

            padding: 38px;

            text-align: left;
        }


        .auth-card h1 {
            margin-bottom: 9px;
        }


        .auth-card .muted {
            margin-bottom: 25px;
            line-height: 1.6;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            .auth-page {
                padding: 20px 14px;
            }

            .auth-card {
                width: 100%;
                padding: 26px 20px;
            }

            .auth-logo {
                justify-content: center;

                width: 100%;

                margin-bottom: 24px;
            }

            .auth-logo-image {
                width: 38px;
                height: 38px;
            }

            .auth-logo-text {
                font-size: 18px;
            }

            .auth-card h1 {
                font-size: 27px;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
        ====================================================== */

        @media (max-width: 380px) {

            .auth-logo-image {
                width: 34px;
                height: 34px;
            }

            .auth-logo-text {
                font-size: 17px;
            }

            .auth-card {
                padding: 23px 17px;
            }

            .auth-card h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <!-- =================================================
             LOGO
        ================================================== -->

        <a
            href="index.html"
            class="auth-logo"
            aria-label="Kembali ke RESIK Hub">


            <img
                class="auth-logo-image"
                src="./assets/logo-gresik-hub.png"
                alt="Logo RESIK Hub">


            <span class="auth-logo-text">
                RESIK Hub
            </span>


        </a>



        <!-- =================================================
             TITLE
        ================================================== -->

        <h1>
            Masuk ke akun Anda
        </h1>


        <p class="muted">
            Masuk sebagai Warga atau Admin untuk melanjutkan.
        </p>



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            id="loginForm">


            <!-- EMAIL -->

            <label for="email">

                Alamat Email

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </label>



            <!-- PASSWORD -->

            <label for="password">

                Kata Sandi

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required>

            </label>



            <!-- REMEMBER -->

            <div class="form-row">


                <label class="check">

                    <input
                        type="checkbox"
                        id="rememberMe">

                    <span>
                        Ingat saya
                    </span>

                </label>


                <a
                    href="#"
                    onclick="return false;">

                    Lupa Kata Sandi?

                </a>


            </div>



            <!-- LOGIN BUTTON -->

            <button
                id="loginButton"
                class="btn btn-full"
                type="submit">

                Masuk →

            </button>


        </form>



        <!-- =================================================
             AUTH MESSAGE
        ================================================== -->

        <p
            id="authMessage"
            class="auth-message"
            aria-live="polite">
        </p>



        <!-- =================================================
             REGISTER
        ================================================== -->

        <p class="auth-foot">

            Belum punya akun?

            <a href="register.html">
                Daftar di sini
            </a>

        </p>


    </div>


</div>



<!-- =====================================================
     APP JS
====================================================== -->

<script
    type="module"
    src="js/app.js">
</script>


</body>

</html>
